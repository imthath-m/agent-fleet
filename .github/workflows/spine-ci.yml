name: spine-ci

on:
  push:
    paths:
      - "shared-infra/**"
      - ".github/workflows/spine-ci.yml"
  pull_request:
    paths:
      - "shared-infra/**"
      - ".github/workflows/spine-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-infra
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check

      - name: Pytest
        run: uv run pytest

      - name: Eval gate (reference agent)
        run: >
          uv run python -m spine.eval gate
          --suite spine.reference_agent:build_reference_suite
          --baseline baselines/reference_agent.json
