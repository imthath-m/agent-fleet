name: support-agent-ci

on:
  push:
    paths:
      - "support-agent/**"
      - "shared-infra/**"
      - ".github/workflows/support-agent-ci.yml"
  pull_request:
    paths:
      - "support-agent/**"
      - "shared-infra/**"
      - ".github/workflows/support-agent-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check

      - name: Pytest
        run: uv run pytest

      - name: Eval gate (classification)
        run: >
          uv run python -m spine.eval gate
          --suite triage.eval.suites:build_classification_suite
          --baseline baselines/classification.json

      - name: Eval gate (resolution)
        run: >
          uv run python -m spine.eval gate
          --suite triage.eval.suites:build_resolution_suite
          --baseline baselines/resolution.json

      - name: Eval gate (actions)
        run: >
          uv run python -m spine.eval gate
          --suite triage.eval.suites:build_actions_suite
          --baseline baselines/actions.json

      - name: Eval gate (escalation)
        run: >
          uv run python -m spine.eval gate
          --suite triage.eval.suites:build_escalation_suite
          --baseline baselines/escalation.json

      - name: Eval gate (triage)
        run: >
          uv run python -m spine.eval gate
          --suite triage.eval.suites:build_triage_suite
          --baseline baselines/triage.json
