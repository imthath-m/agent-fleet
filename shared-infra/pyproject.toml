[project]
name = "spine"
version = "0.1.0"
description = "Shared agentic-AI platform library for production agents on GCP."
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
vertex = [
    "google-genai>=0.3",
]
adk = [
    "google-adk>=0.1",
]
tracing-gcp = [
    "opentelemetry-exporter-gcp-trace>=1.6",
]
logging-gcp = [
    "google-cloud-logging>=3.0",
]
bigquery = [
    "google-cloud-bigquery>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
